name: Set Actions retention to 1 day

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  set-retention:
    if: github.event.issue.title == 'SET_ACTIONS_RETENTION_1_DAY' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set repository retention
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --method PUT "repos/$repo/actions/permissions/artifact-and-log-retention" -f days=1
          gh api "repos/$repo/actions/permissions/artifact-and-log-retention"
